<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Entre na sua conta HBO Max e aproveite as melhores histórias."
    />
    <meta name="theme-color" content="#020228" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=Quicksand:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="assets/images/hbo-logo.svg" />
    <link rel="stylesheet" href="assets/css/login.css" />
    <title>Entrar | HBO Max</title>
  </head>
  <body>
    <!-- MAINTENANCE: Keep in sync with index.html navbar -->
    <nav class="navbar navbar--relative" role="navigation" aria-label="Menu principal">
      <a href="index.html" class="navbar__logo">
        <img
          src="assets/images/hbo-logo.svg"
          alt="Logotipo HBOMax com o nome da marca"
          class="navbar__logo-image"
        />
      </a>
      <button
        class="navbar__toggle"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="navbar-actions"
      >
        <span class="navbar__toggle-icon"></span>
      </button>
      <ul class="navbar__actions" id="navbar-actions" role="menubar">
        <li role="none"><a href="signIn.html" class="navbar__link" role="menuitem" aria-current="page">Entrar</a></li>
        <li role="none">
          <a href="#subscription" class="navbar__link navbar__link--button button" role="menuitem">
            Assine Agora
          </a>
        </li>
      </ul>
    </nav>
    <main class="login-layout">
      <form class="login-form container" action="#" method="post" aria-label="Formulário de login HBO Max">
        <h1 class="login-form__title">Entrar</h1>
        <label class="login-form__label" for="email">Endereço de e-mail</label>
        <input
          class="login-form__field"
          type="email"
          name="email"
          id="email"
          placeholder="Endereço de e-mail"
          required
        />
        <label class="login-form__label" for="password">Senha</label>
        <div class="password-field-wrapper">
          <input
            class="login-form__field"
            type="password"
            name="password"
            id="password"
            placeholder="Senha"
            minlength="8"
            required
            aria-describedby="password-strength-text"
            style="width: 100%; padding-right: 48px;"
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="Mostrar senha"
            data-visible="false"
          >
            <span class="password-toggle__icon"></span>
          </button>
        </div>
        <div class="password-strength" id="password-strength" data-strength="">
          <div class="password-strength__bar"></div>
          <span class="password-strength__text" id="password-strength-text"></span>
        </div>

        <div class="login-form__actions">
          <button type="submit" class="button button--gradient">Entrar</button>
          <a href="#!" class="login-form__link"> Esqueceu a senha? </a>
        </div>
      </form>
    </main>

    <!-- MAINTENANCE: Keep in sync with index.html footer -->
    <footer class="footer container">
      <div class="footer__links" role="list" aria-label="Links do rodapé">
        <a class="footer__link" href="https://www.hbomax.com/br/pt/sitemap">
          Agora na HBO Max
        </a>
        <a class="footer__link" href="https://www.hbomax.com/br/pt/coming-soon">
          Em breve
        </a>
        <a class="footer__link" href="https://www.hbomax.com/br/pt/feature">
          Filme em destaque
        </a>
        <a class="footer__link" href="https://www.hbomax.com/br/pt/series">Séries</a>
        <a class="footer__link" href="https://help.hbomax.com/br">Ajuda</a>
      </div>
      <p class="helper-text--sm footer__legal">
        © 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos
        reservados. HBO Max é usado sob licença.
      </p>
      <nav aria-label="Redes sociais">
        <div class="footer__social">
          <a
            href="https://www.facebook.com/HBOMaxBr/"
            class="footer__social-link"
            aria-label="Facebook HBO Max"
          >
            <img src="assets/images/fb_0.png" alt="" />
          </a>
          <a
            href="https://twitter.com/HBOMaxBR"
            class="footer__social-link"
            aria-label="Twitter HBO Max"
          >
            <img src="assets/images/twitter_0.png" alt="" />
          </a>
          <a
            href="https://www.instagram.com/hbomaxbr/"
            class="footer__social-link"
            aria-label="Instagram HBO Max"
          >
            <img src="assets/images/instagram_0.png" alt="" />
          </a>
          <a
            href="https://www.youtube.com/c/hbomaxbr"
            class="footer__social-link"
            aria-label="YouTube HBO Max"
          >
            <img src="assets/images/youtube_0.png" alt="" />
          </a>
        </div>
      </nav>
    </footer>

    <!-- Back to Top Button -->
    <button class="back-to-top" aria-label="Voltar ao topo">
      <span class="back-to-top__arrow"></span>
    </button>

    <!-- Scroll Progress Indicator -->
    <div class="scroll-indicator" id="scroll-indicator"></div>

    <script src="assets/js/validation.js" defer></script>
    <script src="assets/js/main.js" defer></script>
  </body>
</html>
